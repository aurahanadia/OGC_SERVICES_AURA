<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebGIS WMS dan WFS</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
<input type="text" id="searchBox"
placeholder="Cari state..."
style="
position:absolute;
top:10px;
left:50px;
z-index:1000;
padding:8px;
width:200px;
">
<div id="message"
style="
position:absolute;
color:red;
top:55px;
left:50px;
z-index:1000;
background:white;
padding:6px 10px;
border-radius:5px;
font-size:14px;
display:none;
box-shadow:0 0 5px rgba(0,0,0,0.3);
">
</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>

  // MEMBUAT PETA
  var map = L.map('map').setView([37.8, -96], 4);

  // BASEMAP OSM
  var osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  );
  osm.addTo(map);

  // BASEMAP NONE 
  var none = L.layerGroup();

  // WMS LAYER
  var wmsLayer = L.tileLayer.wms(
    'https://ahocevar.com/geoserver/wms',
    {
      layers: 'topp:states',
      format: 'image/png',
      transparent: true
    }
  ).addTo(map);

  // WFS LAYER
  var wfsLayer;
  fetch(
    'https://ahocevar.com/geoserver/wfs?' +
    'service=WFS&' +
    'version=1.1.0&' +
    'request=GetFeature&' +
    'typeName=topp:states&' +
    'outputFormat=application/json'
  )
  .then(response => response.json())
  .then(data => {
    wfsLayer = L.geoJSON(data, {
		style: {
			color: 'green',        
			weight: 2,           
			fillOpacity: 0       
		},
		onEachFeature: function(feature, layer) {
			layer.bindPopup(
				'<b>Nama State:</b> ' +
				feature.properties.STATE_NAME
			);
		}
	}).addTo(map);

    // BASEMAP CONTROL
    var baseMaps = {
      "OSM": osm,
      "None": none
    };

    // OVERLAY CONTROL
    var overlayMaps = {
      "WMS Layer": wmsLayer,
      "WFS Layer": wfsLayer
    };
	
    // LAYER CONTROL
    L.control.layers(baseMaps, overlayMaps).addTo(map);
	
	// SCALE BAR
	L.control.scale().addTo(map);
	
	// FITUR SEARCH
	document.getElementById("searchBox")
	.addEventListener("keypress", function(e) {
	  if (e.key === "Enter") {
		var keyword = this.value.toLowerCase();
		var found = false;
		wfsLayer.eachLayer(function(layer) {
		  var stateName =
		  layer.feature.properties.STATE_NAME.toLowerCase();
		  if (stateName.includes(keyword)) {
			found = true;
			map.fitBounds(layer.getBounds());
			layer.openPopup();
		  }
		});
		var message =
		document.getElementById("message");
		if (!found) {
		  message.style.display = "block";
		  message.innerHTML =
		  "State tidak ditemukan";
		  setTimeout(function() {
			message.style.display = "none";
			}, 2000);
		}
		else {
		  message.style.display = "none";
		}
	  }
	});
  });

</script>
</body>
</html>
