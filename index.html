<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>WebGIS WMS dan WFS</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
    }

    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

  // =========================
  // MEMBUAT PETA
  // =========================

  var map = L.map('map').setView([37.8, -96], 4);

  // =========================
  // BASEMAP OSM
  // =========================

  var osm = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution: '&copy; OpenStreetMap contributors'
    }
  );

  osm.addTo(map);

  // =========================
  // BASEMAP NONE (kosong)
  // =========================

  var none = L.layerGroup();

  // =========================
  // WMS LAYER
  // =========================

  var wmsLayer = L.tileLayer.wms(
    'https://ahocevar.com/geoserver/wms',
    {
      layers: 'topp:states',
      format: 'image/png',
      transparent: true
    }
  ).addTo(map);

  // =========================
  // WFS LAYER
  // =========================

  var wfsLayer;

  fetch(
    'https://ahocevar.com/geoserver/wfs?' +
    'service=WFS&' +
    'version=1.1.0&' +
    'request=GetFeature&' +
    'typeName=topp:states&' +
    'outputFormat=application/json'
  )

  .then(response => response.json())

  .then(data => {

    wfsLayer = L.geoJSON(data, {

		style: {
			color: 'red',        // warna outline
			weight: 2,           // ketebalan garis
			fillOpacity: 0       // transparan total
		},

		onEachFeature: function(feature, layer) {

			layer.bindPopup(
				'<b>Nama State:</b> ' +
				feature.properties.STATE_NAME
			);

		}

	}).addTo(map);

    // =========================
    // BASEMAP CONTROL
    // =========================

    var baseMaps = {
      "OSM": osm,
      "None": none
    };

    // =========================
    // OVERLAY CONTROL
    // =========================

    var overlayMaps = {
      "WMS Layer": wmsLayer,
      "WFS Layer": wfsLayer
    };

    // Layer control
    L.control.layers(baseMaps, overlayMaps).addTo(map);
	
	// SCALE BAR
	L.control.scale().addTo(map);
	
  });

</script>

</body>
</html>
